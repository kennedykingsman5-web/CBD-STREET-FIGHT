<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CBD STREET FIGHT</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Arial Black', sans-serif; }
  #game-container { width: 100vw; height: 100vh; }
  
  /* UI Overlay */
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    padding: 20px; box-sizing: border-box;
  }
  
  .health-bar {
    width: 40%; height: 20px; background: #333; border: 2px solid #fff; border-radius: 10px;
    overflow: hidden; box-shadow: 0 0 10px rgba(255,0,0,0.5);
  }
  .health-fill { height: 100%; width: 100%; background: #ff2222; transition: width 0.2s; }
  
  .top-ui { display: flex; justify-content: space-between; }
  
  /* On-Screen Controls */
  .controls { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
  .joystick-zone { width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
  .action-buttons { display: flex; gap: 15px; }
  .action-btn {
    width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 50, 50, 0.6);
    border: 3px solid #fff; color: #fff; font-weight: bold; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .action-btn:active { background: rgba(255, 50, 50, 1); transform: scale(0.95); }
</style>
</head>
<body>

<div id="game-container"></div>

<div id="ui-layer">
  <!-- Health Bars -->
  <div class="top-ui">
    <div class="health-bar"><div class="health-fill" id="player-health"></div></div>
    <div class="health-bar" style="transform: scaleX(-1);"><div class="health-fill" id="enemy-health"></div></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="joystick-zone" id="joystick"></div>
    <div class="action-buttons">
      <button class="action-btn" id="btn-punch">PUNCH</button>
      <button class="action-btn" id="btn-kick" style="background: rgba(50, 50, 255, 0.6)">KICK</button>
    </div>
  </div>
</div>

<!-- Import Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>

</body>
</html>
