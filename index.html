<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CBD STREET FIGHT</title>
<style>
  body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Arial Black', sans-serif; color: white; }
  #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
  #welcome-screen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: url('https://images.unsplash.com/photo-1595590424283-b8f17842773f?q=80&w=1000&auto=format&fit=crop') center/cover; }
  #welcome-screen::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.8); }
  .welcome-content { position: relative; z-index: 2; padding: 20px; }
  .welcome-content h1 { font-size: 40px; color: #ff2222; text-shadow: 0 0 20px #ff0000; margin-bottom: 10px; }
  #enter-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; color: white; background: #ff2222; border: 2px solid #fff; border-radius: 10px; box-shadow: 0 0 15px #ff0000; text-transform: uppercase; }
  #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 50; }
  .controls { display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; }
  .joystick-zone { width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
  .action-buttons { display: flex; gap: 15px; }
  .action-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 50, 50, 0.6); border: 3px solid #fff; color: #fff; font-weight: bold; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #fff; display: none; z-index: 200; }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="loading">Loading City...</div>
<div id="welcome-screen">
  <div class="welcome-content">
    <h1>CBD STREET FIGHT</h1>
    <button id="enter-btn">ENTER ARENA</button>
  </div>
</div>
<div id="ui-layer">
  <div class="controls">
    <div class="joystick-zone" id="joystick"></div>
    <div class="action-buttons">
      <button class="action-btn" id="btn-punch">PUNCH</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
let scene, camera, renderer, player, mixer;
let moveVector = { x: 0, y: 0 };
let joystickActive = false;
let joystickStart = { x: 0, y: 0 };
let actions = {};
let pedestrians = [];
let police = null;
let isGameOver = false;
const clock = new THREE.Clock();

document.getElementById('enter-btn').addEventListener('click', () => {
  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('ui-layer').style.display = 'flex';
  document.getElementById('loading').style.display = 'block';
  init3DGame();
});

function init3DGame() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x111111, 10, 80);
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 4, 8);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.getElementById('game-container').appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const road = new THREE.Mesh(new THREE.PlaneGeometry(20, 200), new THREE.MeshStandardMaterial({ color: 0x333333 }));
  road.rotation.x = -Math.PI / 2;
  road.receiveShadow = true;
  scene.add(road);

  for(let i = 0; i < 10; i++) {
    const h = Math.random() * 20 + 10;
    const building = new THREE.Mesh(new THREE.BoxGeometry(15, h, 15), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
    building.position.set(i % 2 === 0 ? -18 : 18, h/2, -i * 20);
    building.castShadow = true;
    scene.add(building);
  }

  const loader = new THREE.GLTFLoader();
  
  // LOAD REAL PLAYER CHARACTER (Soldier)
  loader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf) => {
    player = gltf.scene;
    player.position.set(0, 0, 0);
    player.traverse(n => { if(n.isMesh) n.castShadow = true; });
    scene.add(player);
    mixer = new THREE.AnimationMixer(player);
    actions.idle = mixer.clipAction(THREE.AnimationClip.findByName(gltf.animations, 'Idle'));
    actions.run = mixer.clipAction(THREE.AnimationClip.findByName(gltf.animations, 'Run'));
    actions.punch = mixer.clipAction(THREE.AnimationClip.findByName(gltf.animations, 'Punch'));
    actions.idle.play();
    
    // Spawn Pedestrians ONLY after player loads
    for(let i = 0; i < 5; i++) { spawnPedestrian(loader); }
    document.getElementById('loading').style.display = 'none';
  });

  animate();
}

function spawnPedestrian(loader) {
  // LOAD REAL NPC CHARACTER (Xbot)
  loader.load('https://threejs.org/examples/models/gltf/Xbot.glb', (gltf) => {
    const npc = gltf.scene;
    npc.position.set((Math.random() - 0.5) * 15, 0, -Math.random() * 50);
    npc.traverse(n => { if(n.isMesh) n.castShadow = true; });
    npc.isPedestrian = true;
    
    // Animate NPC walking
    const npcMixer = new THREE.AnimationMixer(npc);
    const walkAction = npcMixer.clipAction(THREE.AnimationClip.findByName(gltf.animations, 'walk'));
    if(walkAction) walkAction.play();
    npc.mixer = npcMixer;

    scene.add(npc);
    pedestrians.push(npc);
  });
}

const joystickZone = document.getElementById('joystick');
joystickZone.addEventListener('touchstart', (e) => {
  joystickActive = true;
  const rect = joystickZone.getBoundingClientRect();
  joystickStart.x = rect.left + rect.width / 2;
  joystickStart.y = rect.top + rect.height / 2;
});
joystickZone.addEventListener('touchmove', (e) => {
  if (!joystickActive) return;
  const touch = e.touches[0];
  const deltaX = touch.clientX - joystickStart.x;
  const deltaY = touch.clientY - joystickStart.y;
  const distance = Math.sqrt(deltaX*deltaX + deltaY*deltaY);
  if (distance > 0) {
    moveVector.x = (deltaX / distance) * Math.min(distance, 50) / 50;
    moveVector.y = (deltaY / distance) * Math.min(distance, 50) / 50;
  }
});
joystickZone.addEventListener('touchend', () => {
  joystickActive = false;
  moveVector = { x: 0, y: 0 };
  if(actions.idle && actions.run) { actions.run.stop(); actions.idle.play(); }
});

document.getElementById('btn-punch').addEventListener('touchstart', () => {
  if(!player || !actions.punch || isGameOver) return;
  actions.run.stop(); actions.idle.stop();
  actions.punch.reset().play();
  setTimeout(() => { actions.punch.stop(); actions.idle.play(); }, 600);

  pedestrians.forEach((npc, index) => {
    if(player.position.distanceTo(npc.position) < 3) {
      scene.remove(npc);
      pedestrians.splice(index, 1);
      if(!police) { spawnPolice(); }
    }
  });
});

function spawnPolice() {
  // LOAD REAL POLICE CHARACTER (RobotExpressive)
  const loader = new THREE.GLTFLoader();
  loader.load('https://threejs.org/examples/models/gltf/RobotExpressive.glb', (gltf) => {
    police = gltf.scene;
    police.position.set(0, 0, -20);
    police.traverse(n => { if(n.isMesh) n.castShadow = true; });
    police.scale.set(0.5, 0.5, 0.5);
    
    const policeMixer = new THREE.AnimationMixer(police);
    const runAction = policeMixer.clipAction(THREE.AnimationClip.findByName(gltf.animations, 'Running'));
    if(runAction) runAction.play();
    police.mixer = policeMixer;

    scene.add(police);
  });
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  
  if (player && !isGameOver) {
    if (moveVector.x !== 0 || moveVector.y !== 0) {
      if(actions.idle) actions.idle.stop();
      if(actions.run && !actions.run.isRunning()) actions.run.play();
      player.position.x += moveVector.x * 0.15;
      player.position.z += moveVector.y * 0.15;
      player.rotation.y = Math.atan2(moveVector.x, moveVector.y);
    }

    camera.position.x += (player.position.x - camera.position.x) * 0.1;
    camera.position.z += (player.position.z + 8 - camera.position.z) * 0.1;
    camera.lookAt(player.position.x, player.position.y + 2, player.position.z);

    pedestrians.forEach(npc => {
      if(npc.mixer) npc.mixer.update(delta);
      npc.position.z -= 0.02;
      npc.rotation.y = Math.PI; 
      if(npc.position.z < -60) npc.position.z = 10;
    });

    if(police) {
      if(police.mixer) police.mixer.update(delta);
      police.position.x += (player.position.x - police.position.x) * 0.02;
      police.position.z += (player.position.z - police.position.z) * 0.02;
      
      if(player.position.distanceTo(police.position) < 2) {
        isGameOver = true;
        alert("BUSTED! The police caught you.");
        location.reload();
      }
    }
  }
  renderer.render(scene, camera);
}
</script>
</body>
</html>
